---
name: ci

on:
  # Build + test changes proposed against main (the merge gate).
  pull_request:
    branches: [main]
  # Publish a release when a v* tag is pushed.
  push:
    tags: ["v*"]

# Least privilege by default: the build/test job only needs to read the repo.
# The release job below opts into write access for itself.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Stage release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd target
          sha256sum keycloak-mfa-rest.jar > keycloak-mfa-rest.jar.sha256
          cat keycloak-mfa-rest.jar.sha256

      - name: Upload build artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: release-jar
          path: |
            target/keycloak-mfa-rest.jar
            target/keycloak-mfa-rest.jar.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Write access is scoped to this tag-only release job, not the build/test job.
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-jar

      - name: Publish release
        # GitHub CLI (pre-installed on runners, maintained by GitHub) — no third-party
        # action to vendor or pin. Publishes a release for the pushed v* tag.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            keycloak-mfa-rest.jar keycloak-mfa-rest.jar.sha256
